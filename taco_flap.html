<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taco Flap 🌮</title>
<style>
html,body{margin:0;min-height:100%;background:#dff5ff;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:20px;box-sizing:border-box}
.wrap{text-align:center;width:min(520px,100%)}
.game{position:relative;overflow:hidden;border:3px solid #333;border-radius:18px;background:#bfe9ff;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:auto}
.score{position:absolute;top:12px;left:0;right:0;color:white;font:bold 36px Arial;text-shadow:0 2px 4px #333;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0004}
.panel{background:white;border-radius:18px;padding:25px;max-width:320px;box-shadow:0 5px 20px #0004}
.panel h1{margin:5px 0 10px}.panel p{color:#555}
button{border:0;border-radius:12px;padding:13px 24px;font-weight:bold;font-size:16px;cursor:pointer;background:#f4a261}
.hint{margin-top:10px;color:#555}
</style>
</head>
<body>
<div class="wrap">
<div class="game">
<canvas id="c" width="416" height="520"></canvas>
<div class="score" id="score">0</div>
<div class="overlay" id="overlay"><div class="panel">
<div style="font-size:60px">🌮</div>
<h1 id="title">Taco Flap</h1>
<p id="msg">Help the taco fly through the salsa pipes!</p>
<button id="btn">Start Game</button>
</div></div>
</div>
<div class="hint">Tap, click, or press Space to flap.</div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height;
const ov=document.getElementById('overlay'),btn=document.getElementById('btn');
const scoreEl=document.getElementById('score'),title=document.getElementById('title'),msg=document.getElementById('msg');
let taco,pipes,score,playing,last,spawn,raf;
function reset(){taco={x:92,y:250,vy:0,r:18};pipes=[];score=0;spawn=0;last=performance.now();scoreEl.textContent=0;playing=true;ov.style.display='none';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function flap(){if(!playing){reset();return} taco.vy=-6.2}
function addPipe(){let top=55+Math.random()*205;pipes.push({x:W+20,top,bottom:top+148,w:62,passed:false})}
function over(){playing=false;ov.style.display='flex';title.textContent='Game Over!';msg.textContent='Your taco scored '+score+'.';btn.textContent='Play Again'}
function bg(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9edfff');g.addColorStop(.72,'#d9f7ff');g.addColorStop(.72,'#a8d86f');g.addColorStop(1,'#79b94d');x.fillStyle=g;x.fillRect(0,0,W,H)}
function pipe(p){let g=x.createLinearGradient(p.x,0,p.x+p.w,0);g.addColorStop(0,'#7b3f16');g.addColorStop(.5,'#d27624');g.addColorStop(1,'#8b4a18');x.fillStyle=g;x.fillRect(p.x,0,p.w,p.top);x.fillRect(p.x,p.bottom,p.w,H-p.bottom);x.fillStyle='#f2a33b';x.fillRect(p.x-5,p.top-15,p.w+10,15);x.fillRect(p.x-5,p.bottom,p.w+10,15)}
function drawTaco(){x.save();x.translate(taco.x,taco.y);x.rotate(Math.max(-.35,Math.min(.65,taco.vy*.055)));x.font='38px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🌮',0,0);x.restore()}
function hit(p){return taco.x+taco.r>p.x&&taco.x-taco.r<p.x+p.w&&(taco.y-taco.r<p.top||taco.y+taco.r>p.bottom)}
function loop(now){if(!playing)return;let dt=Math.min((now-last)/16.67,2);last=now;spawn+=dt;if(spawn>92){addPipe();spawn=0}taco.vy+=.34*dt;taco.y+=taco.vy*dt;for(const p of pipes){p.x-=2.45*dt;if(!p.passed&&p.x+p.w<taco.x){p.passed=true;score++;scoreEl.textContent=score}}pipes=pipes.filter(p=>p.x+p.w>-20);bg();pipes.forEach(pipe);drawTaco();if(taco.y-taco.r<0||taco.y+taco.r>H||pipes.some(hit)){over();return}raf=requestAnimationFrame(loop)}
btn.onclick=reset;c.addEventListener('pointerdown',e=>{e.preventDefault();flap()});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});bg();taco={x:92,y:250,vy:0,r:18};drawTaco();
</script>
</body>
</html>
